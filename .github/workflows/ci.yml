name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run zip:all
      - run: npx --yes web-ext@8 lint -s apps/folders-extension/.output/firefox-mv3
      - uses: actions/upload-artifact@v4
        with:
          name: folders-extension
          path: apps/folders-extension/.output/*.zip
